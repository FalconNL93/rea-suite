name: Check

# Server-side run of `rea-suite check`, the gate before a push (AGENTS.md): .githooks/lint.sh,
# then every Python and Node unit test; the opt-in integration tests skip without their switches.
# Python comes from the dev and test groups in uv.lock only (no frida, mitmproxy or flare-floss),
# Node from .node-version with the npm packages the Node test imports. No pwsh in the image, so
# the PowerShell parse check only runs locally. gitleaks.yml stays on every push.
on:
  pull_request:
  push:
    # Files no lint or test reads, so a push of them alone starts no run (ci-images'
    # porttools/paths-ignore.base). No `!` line: Forgejo reads `!x` in paths-ignore as "ignore
    # every path but x".
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"
      - ".vscode/**"
      - ".devcontainer/**"
      - ".envrc"
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (latest release, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/astral-sh/uv/releases/latest | sed 's|.*/tag/||')
          asset=uv-x86_64-unknown-linux-gnu.tar.gz
          url=https://github.com/astral-sh/uv/releases/download/$tag/$asset
          mkdir -p "$RUNNER_TEMP/uv"
          cd "$RUNNER_TEMP/uv"
          curl -fsSLO "$url"
          echo "$(curl -fsSL "$url.sha256" | awk '{print $1}')  $asset" | sha256sum -c -
          tar -xzf "$asset" --strip-components=1
          ./uv --version
          echo "$RUNNER_TEMP/uv" >> "$GITHUB_PATH"

      - name: Install Node (.node-version, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          version=v$(tr -d '[:space:]' < .node-version)
          asset=node-$version-linux-x64.tar.xz
          mkdir -p "$RUNNER_TEMP/node"
          cd "$RUNNER_TEMP/node"
          curl -fsSLO "https://nodejs.org/dist/$version/$asset"
          curl -fsSL "https://nodejs.org/dist/$version/SHASUMS256.txt" | grep " $asset\$" | sha256sum -c -
          tar -xJf "$asset" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"

      - name: Python from uv.lock (dev and test groups only)
        shell: bash
        # the same Python folder and preference common/env.sh sets, so the suite's scripts take this .venv
        run: |
          UV_PYTHON_INSTALL_DIR="$PWD/.runtime/python" UV_PYTHON_PREFERENCE=only-managed \
            uv sync --frozen --only-group dev --only-group test

      - name: npm packages (package-lock.json; no install scripts)
        shell: bash
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check
        shell: bash
        run: bin/rea-suite check
