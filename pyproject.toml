[project]
name = "rea-suite"
version = "0.1.0"
description = "Personal reverse engineering suite: tool manifest, installers and Python RE libraries"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6",
    # Dynamic instrumentation (CLI: frida, frida-ps, frida-trace, ...)
    "frida-tools>=14",
    # Binary formats: ELF / PE / Mach-O / OAT / DEX parsing + modification
    "lief>=0.16",
    # PE-specific parsing (also a transitive dependency of flare-floss)
    "pefile>=2024.8.26",
    # Obfuscated string extraction (CLI: floss)
    "flare-floss>=3",
    # HTTP(S) interception (CLI: mitmproxy, mitmdump, mitmweb)
    "mitmproxy>=12",
    # YARA-X Python bindings (the `yr` CLI comes from common/tools.yml)
    "yara-x>=1",
    # Detect It Easy engine; provides the `diec` console command (GUI: tools.yml).
    # No wheel for macOS on Apple Silicon.
    "die-python>=0.5; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # Capability detection, companion to FLOSS (CLI: capa)
    "flare-capa>=9",
    # Exploit/CTF toolkit; rea uses it via REA_PWNTOOLS_PYTHON
    "pwntools>=4.14; sys_platform != 'win32'",
    # Frida-based mobile runtime exploration (CLI: objection)
    "objection>=1.12",
    # Binary diffing on top of Ghidra/pyghidra (CLI: ghidriff)
    "ghidriff>=1",
    # Disassembler / CPU emulator / assembler engines
    "capstone>=5",
    "unicorn>=2.1",
    "keystone-engine>=0.9.2",
    # Build systems as self-contained wheels (compilers come from apt/winget)
    "cmake>=3.30",
    "ninja>=1.11",
    "meson>=1.5",
]

[project.scripts]
rea-tools = "rea_suite.cli:main"
diec = "rea_suite.diec:main"

[dependency-groups]
# angr is large; install with `uv sync --group angr` (rea-suite keeps it once installed)
# angr pins old arpy/unicorn versions; CLI tools that clash with it go in
# common/uv-tools.txt (isolated environments) instead of here.
angr = ["angr>=10"]
# Linters for this repository's own code (.githooks/lint.sh, `rea-suite lint`)
dev = [
    "ruff>=0.8",
    # shellcheck binary as a wheel, so it comes from uv like ruff
    "shellcheck-py>=0.11",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rea_suite"
module-root = "common"

[tool.ruff]
line-length = 100
