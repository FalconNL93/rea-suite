# Tools that have no usable package-manager release on every platform.
#
# Managed by `rea-suite` (rea-tools --help, or `rea-suite tools ...`):
#   install [name...]   install missing tools
#   reinstall [name...] remove and install again
#   update  [name...]   move `version: latest` tools to the newest release
#   status              show installed vs. latest versions (and Ghidra extensions)
#   use <tool> <ver>    switch back to another installed version (rollback)
#   prune               remove inactive versions
#   frida-server        push frida-server (same version as pip frida) to an Android device
#   mitm-ca             put mitmproxy's CA on an Android device (--system: rooted, until reboot)
#
# Installed into tools/<name>/<version>/ with tools/<name>/current pointing at
# the active version. Launchers are generated in tools/bin/ (on PATH via .envrc).
#
# github:      owner/repo; `version` is `latest` or an exact release tag
#              or `{linux, macos, windows}`: a repository per platform (RPCS3)
# version-env: a variable that, when set (run or .env), replaces `version` (`latest`, a tag)
# assets:      per-platform regex (linux, macos, windows) matched against release asset
#              names; macOS means Apple Silicon. A .dmg is unpacked to its .app bundles.
# strip:       leading path components to drop when extracting
# bin:         per-platform launchers; `name: path` (relative to the install dir)
#              or `name: {path: ..., env: {VAR: value}}`; `{dir}` expands to the install dir.
#              Paths are globs (`**` allowed); the last match wins. `jar: true`
#              runs the file with `java -jar`.
# dotnet-tool: NuGet package installed with `dotnet tool install --tool-path`
#              `any:` instead of a platform is a list of regexes, each matching one
#              asset, installed on every platform (device binaries, data). A single
#              .xz file is decompressed.
#              `version: pip:<package>` follows the installed version of that Python
#              package (release tag = package version) on install and update.
#              `version: head` follows the newest commit of the default branch
#              (for projects without releases; needs `build:`).
# build:       how to build from source when no asset exists for the platform
#              (common/rea_suite/build.py): `{cargo: <crate>}`, `{cmake: true}` or
#              `{script: <path>}` (a suite script run on the release's source).
#              Rebuilt only when the version changes; off with REA_TOOLS_NO_BUILD=1.
# url:         per-platform direct download instead of `github` (for self-updating
#              tools); `version` is then just a label
# appdistrib:  `{org, channels: {<platform>: <channel>}}` instead of `github`: the newest
#              build of a distrib.app channel (PCSX-Redux), installed like a release
#              (`assets`, `bin`, rollback); its version is the build's own
#
# Tools listed under a component in common/components.yml are only installed
# when that component is selected.
#
# ghidra-extensions: resolved again for every Ghidra version. `asset` is a regex
#              in which {ghidra} is the Ghidra version (e.g. 12.1.4); the newest
#              release with such a build is used. With `build: true` and no
#              matching build, the newest release's source (`subdir` if nested)
#              is built with Ghidra's own Gradle wrapper (`gradle-args` adds arguments;
#              `deps` copies files of other releases into the source first:
#              `{github, version, assets: {<platform>: regex}, copy: {<glob>: <dir>}}`,
#              `{os}` in a dir is Ghidra's native directory name).
#              Optional extensions set `component: <name>`; deselection leaves installed copies.
#              `commit: <full hash>` builds that commit's source instead (no release lookup;
#              `build: true` required), for a fix that came after the newest release.
# plugins:     files from another release copied into the install dir:
#              `copy: {<glob in archive>: <dir in install>}`.

tools:
  # Pinned to the build REA verifies (SUPPORTED_GHIDRA_VERSION in rea-agents'
  # GhidraReleasePolicy.js); `rea-tools rea-pins` checks it on update and doctor.
  ghidra:
    github: NationalSecurityAgency/ghidra
    version: Ghidra_12.1.4_build
    assets:
      linux: '^ghidra_.*_PUBLIC_\d+\.zip$'
      macos: '^ghidra_.*_PUBLIC_\d+\.zip$'
      windows: '^ghidra_.*_PUBLIC_\d+\.zip$'
    strip: 1
    bin:
      linux: &ghidra-unix
        ghidra: ghidraRun
        analyzeHeadless: support/analyzeHeadless
        pyghidraRun: support/pyghidraRun
      macos: *ghidra-unix
      windows:
        ghidra: ghidraRun.bat
        analyzeHeadless: support/analyzeHeadless.bat
        pyghidraRun: support/pyghidraRun.bat
    ghidra-extensions:
      # crypto constants / signatures
      findcrypt:
        github: antoniovazquezblanco/GhidraFindcrypt
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_GhidraFindcrypt\.zip$'
        build: true
      # function hashing, OOAnalyzer C++ class recovery. Built like upstream's CI does
      # when no release has a build for this Ghidra: Z3 from its release, not compiled.
      kaiju:
        github: CERTCC/kaiju
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_kaiju\.zip$'
        build: true
        gradle-args: [-PKAIJU_SKIP_Z3_BUILD, buildExtension]
        deps:
          # the Z3 version kaiju's release workflow builds against
          - github: Z3Prover/z3
            version: z3-4.12.1
            assets:
              linux: '^z3-4\.12\.1-x64-glibc-2\.35\.zip$'
              macos: '^z3-4\.12\.1-arm64-osx-11\.0\.zip$'
              windows: '^z3-4\.12\.1-x64-win\.zip$'
            copy: {'bin/*.jar': lib, 'bin/*.so': 'os/{os}', 'bin/*.dylib': 'os/{os}', 'bin/*.dll': 'os/{os}'}
      # Xbox 360 XEX loader (rea-suite xbox360). Pinned: 12.1.3's source, built for Ghidra 12.1.4,
      # is the release `xbox360` was verified with (CoD3's XEX and PE image, 2026-11-03); move it
      # with the Ghidra pin, then run `rea-suite xbox360 check`.
      xexloaderwv:
        github: zeroKilo/XEXLoaderWV
        version: '12.1.3'
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_XEXLoaderWV\.zip$'
        build: true
        subdir: XEXLoaderWV
      # Original Xbox XBE loader (rea-ghidra, rea-suite xbox): sections at their addresses, kernel
      # imports by ordinal, and XDK library functions named during analysis by the XbSymbolDatabase
      # CLI it bundles (v3.1.160, MIT; Linux x86_64, Windows x64, macOS x86_64, which Ghidra runs
      # under Rosetta 2 on Apple Silicon). Upstream releases a build for each Ghidra version; no
      # source build here (its build.sh fetches its own Ghidra and JDK, and the repository has no
      # license file).
      xbe:
        github: XboxDev/ghidra-xbe
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_ghidra-xbe\.zip$'
      # LE/LX loader (DOS/4GW and DOS/16 LE, DOS32A, OS/2 LX, VxD): objects at their bases, every
      # fixup applied, typed headers; per-object base and selector overrides. Pinned to a commit:
      # Ghidra 12.1's compiler-spec fix and the Watcom ABI came after its newest release (v12.0.1).
      # Wanted by the Theme Park port (DOS/4GW, 2026-11-11); move it with the Ghidra pin.
      lxloader:
        github: yetmorecode/ghidra-lx-loader
        commit: 60bae5199fdada5b3b825741a94bfbbe04cb7a5f
        build: true
      # UEFI, PCI option ROM and other firmware loaders
      firmware-utils:
        github: al3xtjames/ghidra-firmware-utils
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_ghidra-firmware-utils\.zip$'
        build: true
      # Optional console loaders; exact-version release assets only (the psx source lacks its PsyQ submodule).
      psx:
        component: playstation
        github: lab313ru/ghidra_psx_ldr
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_ghidra_psx_ldr\.zip$'
      emotionengine:
        component: playstation
        github: chaoticgd/ghidra-emotionengine-reloaded
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_ghidra-emotionengine-reloaded\.zip$'
      # PS3 ELF/PRX: import and export tables named from its NID list, the TOC (r2) set from the
      # OPDs, LV2 syscalls named (component ps3, docs/PS3.md). No release for Ghidra 12.1.4
      # (its newest, 1.0111, stops at 12.1.2), so a source build; the repository has no license.
      ps3ghidrascripts:
        component: ps3
        github: clienthax/Ps3GhidraScripts
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_Ps3GhidraScripts\.zip$'
        build: true
      # GameCube/Wii DOL, REL, apploader and RAM dump loader with the Gekko/Broadway language
      # (paired singles); component gamecube, docs/GAMECUBE-WII.md. No release has a 12.1.4 build
      # (1.3.1 is for 12.1, which 12.1.4 refuses), and 1.3.1's build.gradle calls Project.exec(),
      # which the Gradle 9 of Ghidra 12.1.4 removed. Pinned to the commit that moved to
      # providers.exec (2026-11-11), built for the installed Ghidra; checked with a DOL import
      # (2026-11-13). Move it with the Ghidra pin. --no-build / REA_TOOLS_NO_BUILD skips it.
      gamecube:
        component: gamecube
        github: Cuyler36/Ghidra-GameCube-Loader
        commit: bc17469a6e37c260b07e8c46f0c9bde2bd3e97dc
        build: true
      # PSP Allegrex processor: VFPU, PSP relocations, PPSSPP .sym scripts (component psp,
      # docs/PSP.md). REA's PSP profile (6.8.0 and 6.9.0) uses it from Extensions/ghidra-allegrex.
      # Not pinned: v21.4 is the newest release with a 12.1.4 build; v21.5 and later are 12.2 only.
      allegrex:
        component: psp
        github: kotcrab/ghidra-allegrex
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_ghidra-allegrex\.zip$'
      # .NET Native AOT analysis; rea uses its jar (REA_GHIDRA_NATIVEAOT_JAR)
      nativeaot:
        github: Washi1337/ghidra-nativeaot
        asset: '^ghidra_{ghidra}_PUBLIC_\d+_ghidra-nativeaot\.zip$'
        build: true

  # CD extraction and layout-aware rebuilding; PS2 DVDs use 7-Zip instead.
  mkpsxiso:
    github: Lameguy64/mkpsxiso
    version: latest
    assets:
      linux: '^mkpsxiso-[\d.]+-Linux\.zip$'
      macos: '^mkpsxiso-[\d.]+-Darwin\.zip$'
      windows: '^mkpsxiso-[\d.]+-win64\.zip$'
    strip: 1
    bin:
      linux: &mkpsxiso-unix
        dumpsxiso: bin/dumpsxiso
        mkpsxiso: bin/mkpsxiso
      macos: *mkpsxiso-unix
      windows:
        dumpsxiso: dumpsxiso.exe
        mkpsxiso: mkpsxiso.exe

  # Java CLI/GUI for PS1 audio/video/TIM assets; optional playstation component.
  jpsxdec:
    github: m35/jpsxdec
    version: latest
    assets:
      linux: '^jpsxdec_v[\d.]+(?:-beta)?\.zip$'
      macos: '^jpsxdec_v[\d.]+(?:-beta)?\.zip$'
      windows: '^jpsxdec_v[\d.]+(?:-beta)?\.zip$'
    bin:
      linux: &jpsxdec-bin
        jpsxdec: {path: '**/jpsxdec.jar', jar: true}
      macos: *jpsxdec-bin
      windows: *jpsxdec-bin

  # PS1 emulator for reverse engineering: debugger, memory editor, GDB server, Lua, web API,
  # and OpenBIOS, so it starts without a Sony BIOS. No GitHub releases: every main-branch commit
  # is a build on distrib.app, the channels its own updater reads (component playstation).
  pcsx-redux:
    appdistrib:
      org: pcsx-redux
      channels: {linux: dev-linux-x64, macos: dev-macos-arm, windows: dev-win-x64}
    assets:
      linux: '^PCSX-Redux-\w+-linux-x86_64\.zip$'
      macos: '^PCSX-Redux-\w+-Arm\.dmg$'
      windows: '^pcsx-redux-nightly-[\d.]+-x64\.zip$'
    bin:
      linux:
        pcsx-redux: {path: 'PCSX-Redux-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      macos:
        pcsx-redux: PCSX-Redux.app/Contents/MacOS/PCSX-Redux
      windows:
        pcsx-redux: pcsx-redux.exe
        psyq-obj-parser: psyq-obj-parser.exe

  # PS2 emulator with its debugger (EE/IOP disassembly, breakpoints, memory, symbols from the
  # ELF) and PINE for scripted memory access; needs a BIOS dumped from your own console.
  # The Windows build is only a .7z (extracted with the base suite's 7-Zip).
  pcsx2:
    github: PCSX2/pcsx2
    version: latest
    assets:
      linux: '^pcsx2-v[\d.]+-linux-appimage-x64-Qt\.AppImage$'
      macos: '^pcsx2-v[\d.]+-macos-Qt\.tar\.xz$'
      windows: '^pcsx2-v[\d.]+-windows-x64-Qt\.7z$'
    bin:
      linux:
        pcsx2: {path: 'pcsx2-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      macos:
        pcsx2: '*.app/Contents/MacOS/PCSX2'
      windows:
        pcsx2: pcsx2-qt.exe

  # Per-function match of a decompilation's objects against the original (MIPS, PPC, x86,
  # ARM); the CLI for scripts and CI, the GUI to work in (component decomp).
  objdiff:
    github: encounter/objdiff
    version: latest
    assets:
      linux: ['^objdiff-cli-linux-x86_64$', '^objdiff-linux-x86_64$']
      macos: ['^objdiff-cli-macos-arm64$', '^objdiff-macos-arm64$']
      windows: ['^objdiff-cli-windows-x86_64\.exe$', '^objdiff-windows-x86_64\.exe$']
    bin:
      linux:
        objdiff-cli: objdiff-cli-linux-x86_64
        objdiff: objdiff-linux-x86_64
      macos:
        objdiff-cli: objdiff-cli-macos-arm64
        objdiff: objdiff-macos-arm64
      windows:
        objdiff-cli: objdiff-cli-windows-x86_64.exe
        objdiff: objdiff-windows-x86_64.exe

  # --- component: gamecube ---

  # GameCube/Wii emulator with a GDB stub (General.GDBPort) and DolphinTool (convert, verify,
  # extract). Pinned to 2609b, the release docs/GAMECUBE-WII.md was read at (2026-11-13); no
  # GitHub releases, so a direct download. Linux uses the distribution's dolphin-emu (apt), which
  # has dolphin-tool and dolphin-emu-nogui; the macOS app has no DolphinTool.
  dolphin:
    url:
      macos: https://dl.dolphin-emu.org/releases/2609b/dolphin-2609b-universal.dmg
      windows: https://dl.dolphin-emu.org/releases/2609b/dolphin-2609b-x64.7z
    version: '2609b'
    strip: 1
    bin:
      macos:
        dolphin: Dolphin.app/Contents/MacOS/Dolphin
      windows:
        dolphin: Dolphin.exe
        dolphin-tool: DolphinTool.exe

  # decomp-toolkit: splits a DOL and its RELs into objects for a matching decompilation, with
  # symbol and split files; dtk-template is the project layout around it.
  dtk:
    github: encounter/decomp-toolkit
    version: latest
    assets:
      linux: '^dtk-linux-x86_64$'
      macos: '^dtk-macos-arm64$'
      windows: '^dtk-windows-x86_64\.exe$'
    bin:
      linux:
        dtk: dtk-linux-x86_64
      macos:
        dtk: dtk-macos-arm64
      windows:
        dtk: dtk-windows-x86_64.exe

  # --- component: psp ---

  # PSP emulator with a debugger (GUI), the WebSocket debugger API (subprotocol
  # debugger.ppsspp.org) and .sym export. Pinned to v1.20.4, the tag docs/PSP.md read
  # Core/Debugger/WebSocket at (2026-11-13); move it after reading that again.
  ppsspp:
    github: hrydgard/ppsspp
    version: v1.20.4
    assets:
      linux: '^PPSSPP-v[\d.]+-anylinux-x86_64\.AppImage$'
      macos: '^PPSSPPSDL-macOS-v[\d.]+\.zip$'
      windows: '^PPSSPP-v[\d.]+-Windows-x64\.zip$'
    bin:
      linux:
        ppsspp: {path: 'PPSSPP-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      macos:
        ppsspp: PPSSPPSDL.app/Contents/MacOS/PPSSPPSDL
      windows:
        ppsspp: PPSSPPWindows64.exe

  # PPSSPP's source at the tag of the build above: the HLE tables (Core/HLE/*.cpp) that
  # `rea-suite psp info` names firmware imports from. Data only, never built. Move it with ppsspp.
  ppsspp-source:
    version: v1.20.4
    url:
      linux: &ppsspp-source https://github.com/hrydgard/ppsspp/archive/refs/tags/v1.20.4.tar.gz
      macos: *ppsspp-source
      windows: *ppsspp-source
    strip: 1

  # Original upstream publishes Windows CLI binaries; Linux/macOS builds are not configured.
  xgdtool:
    github: wiredopposite/XGDTool
    version: latest
    assets:
      windows: '^XGDTool-v[\d.]+-win-x64-CLI\.exe$'
    bin:
      windows:
        XGDTool: 'XGDTool-*-CLI.exe'

  # Windows release binary; native Linux/macOS source builds need zstd development files. v0.1.2
  # (2022) is the newest release; master's later commits add CI and stream input, no format change.
  # Built and round-tripped on Linux x86_64, 2026-11-13. Reading is rea-suite zar's (zar.py).
  zarchive:
    github: Exzap/ZArchive
    version: latest
    assets:
      windows: '^zarchive\.exe$'
    build: {cmake: true}
    bin:
      linux: &zarchive-unix
        zarchive: zarchive
      macos: *zarchive-unix
      windows:
        zarchive: zarchive.exe

  extract-xiso:
    github: XboxDev/extract-xiso
    version: latest
    assets:
      linux: '^extract-xiso_Linux\.zip$'
      macos: '^extract-xiso_macOS\.zip$'
      windows: '^extract-xiso-Win64_Release\.zip$'
    bin:
      linux: &extract-xiso-unix
        extract-xiso: '**/extract-xiso'
      macos: *extract-xiso-unix
      windows:
        extract-xiso: '**/extract-xiso.exe'

  # Author-maintained mirror. Label follows the version inside the mutable download;
  # update --ai checks it. The 0.12.0 Linux (static i386) and macOS (x86_64) builds are not configured.
  quickbms:
    version: '0.12.0'
    url:
      windows: https://mirror.aluigi.org/papers/quickbms.zip
    bin:
      windows:
        quickbms: quickbms.exe
        quickbms-4gb: quickbms_4gb_files.exe

  jadx:
    github: skylot/jadx
    version: latest
    assets:
      linux: '^jadx-[\d.]+\.zip$'
      macos: '^jadx-[\d.]+\.zip$'
      windows: '^jadx-gui-[\d.]+-win\.zip$'
    bin:
      linux: &jadx-unix
        jadx: bin/jadx
        jadx-gui: bin/jadx-gui
      macos: *jadx-unix
      windows:
        jadx-gui: '**/jadx-gui-*.exe'

  # Detect It Easy. The Linux AppImage has only the GUI; `diec` on Linux comes
  # from die-python (pyproject.toml), on Windows from the portable zip. macOS on
  # Apple Silicon has only a .pkg installer and no die-python wheel, so no DIE there.
  die:
    github: horsicq/DIE-engine
    version: latest
    assets:
      linux: '^Detect_It_Easy-[\d.]+-x86_64\.AppImage$'
      windows: '^die_win64_portable_[\d.]+_x64\.zip$'
    bin:
      linux:
        die: {path: 'Detect_It_Easy-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      windows:
        diec: '**/diec.exe'
        die: '**/die.exe'

  ripgrep:
    github: BurntSushi/ripgrep
    version: latest
    assets:
      linux: '^ripgrep-[\d.]+-x86_64-unknown-linux-musl\.tar\.gz$'
      macos: '^ripgrep-[\d.]+-aarch64-apple-darwin\.tar\.gz$'
      windows: '^ripgrep-[\d.]+-x86_64-pc-windows-msvc\.zip$'
    strip: 1
    bin:
      linux:
        rg: rg
      macos:
        rg: rg
      windows:
        rg: rg.exe

  # Secret scanning for extracted apps, bundles and firmware trees
  gitleaks:
    github: gitleaks/gitleaks
    version: latest
    assets:
      linux: '^gitleaks_[\d.]+_linux_x64\.tar\.gz$'
      macos: '^gitleaks_[\d.]+_darwin_arm64\.tar\.gz$'
      windows: '^gitleaks_[\d.]+_windows_x64\.zip$'
    bin:
      linux:
        gitleaks: gitleaks
      macos:
        gitleaks: gitleaks
      windows:
        gitleaks: gitleaks.exe

  # Not packaged for Ubuntu; static build has no runtime dependencies.
  # macOS gets rizin from Homebrew (platforms/macos/Brewfile): upstream ships only a .pkg.
  rizin:
    github: rizinorg/rizin
    version: latest
    assets:
      linux: '^rizin-v[\d.]+-static-x86_64\.tar\.xz$'
      windows: '^rizin-windows-static-v[\d.]+\.zip$'
    bin:
      linux:
        rizin: bin/rizin
        rz-bin: bin/rz-bin
        rz-asm: bin/rz-asm
        rz-diff: bin/rz-diff
        rz-find: bin/rz-find
        rz-hash: bin/rz-hash
        rz-ax: bin/rz-ax
      windows:
        rizin: '**/bin/rizin.exe'
        rz-bin: '**/bin/rz-bin.exe'
        rz-asm: '**/bin/rz-asm.exe'
        rz-diff: '**/bin/rz-diff.exe'
        rz-find: '**/bin/rz-find.exe'
        rz-hash: '**/bin/rz-hash.exe'
        rz-ax: '**/bin/rz-ax.exe'

  # YARA-X command line (`yr`); Python bindings come from pyproject.toml.
  yara-x:
    github: VirusTotal/yara-x
    version: latest
    assets:
      linux: '^yara-x-v[\d.]+-x86_64-unknown-linux-gnu\.tar\.gz$'
      macos: '^yara-x-v[\d.]+-aarch64-apple-darwin\.tar\.gz$'
      windows: '^yara-x-v[\d.]+-x86_64-pc-windows-msvc\.zip$'
    bin:
      linux:
        yr: yr
      macos:
        yr: yr
      windows:
        yr: '**/yr.exe'

  # Capability detection, companion to FLOSS. The standalone build embeds the rules
  # and signatures of its version; the pip package ships neither.
  capa:
    github: mandiant/capa
    version: latest
    assets:
      linux: '^capa-v[\d.]+-linux\.zip$'
      macos: '^capa-v[\d.]+-macos-arm64\.zip$'
      windows: '^capa-v[\d.]+-windows\.zip$'
    bin:
      linux:
        capa: capa
      macos:
        capa: capa
      windows:
        capa: capa.exe

  # Go symbol, type and build info recovery from stripped Go binaries.
  # The macOS build is x86_64 and runs under Rosetta 2.
  goresym:
    github: mandiant/GoReSym
    version: latest
    assets:
      linux: '^GoReSym-linux\.zip$'
      macos: '^GoReSym-mac\.zip$'
      windows: '^GoReSym-windows\.zip$'
    bin:
      linux:
        goresym: GoReSym
      macos:
        goresym: GoReSym
      windows:
        goresym: GoReSym.exe

  # Apple firmware, dyld_shared_cache, Mach-O and class-dump in one CLI
  ipsw:
    github: blacktop/ipsw
    version: latest
    assets:
      linux: '^ipsw_[\d.]+_linux_x86_64\.tar\.gz$'
      macos: '^ipsw_[\d.]+_macOS_arm64\.tar\.gz$'
      windows: '^ipsw_[\d.]+_windows_x86_64\.zip$'
    bin:
      linux:
        ipsw: ipsw
      macos:
        ipsw: ipsw
      windows:
        ipsw: ipsw.exe

  # Executable packer; `upx -d` unpacks. macOS gets it from Homebrew (no upstream build).
  upx:
    github: upx/upx
    version: latest
    assets:
      linux: '^upx-[\d.]+-amd64_linux\.tar\.xz$'
      windows: '^upx-[\d.]+-win64\.zip$'
    strip: 1
    bin:
      linux:
        upx: upx
      windows:
        upx: upx.exe

  # Python bytecode decompiler/disassembler (pycdc, pycdas), for the .pyc files
  # pyinstxtractor-ng pulls out of PyInstaller apps. No releases or tags upstream:
  # built from the newest commit with CMake (component `build`), again only when
  # that commit changes.
  pycdc:
    github: zrax/pycdc
    version: head
    build: {cmake: true}
    bin:
      linux: &pycdc-unix
        pycdc: pycdc
        pycdas: pycdas
      macos: *pycdc-unix
      windows:
        pycdc: pycdc.exe
        pycdas: pycdas.exe

  # ILSpy command line decompiler for .NET assemblies.
  ilspycmd:
    dotnet-tool: ilspycmd
    version: latest

  # --- Engines that rea drives directly (see `rea doctor`) ---

  # rea's JADX provider (REA_JADX_MCP_JAR). Pinned to the version rea verifies.
  jadx-headless-mcp:
    github: 1013503897/jadx-headless-mcp
    version: v0.7.1
    assets:
      linux: '^jadx-headless-mcp-[\d.]+-all\.jar$'
      macos: '^jadx-headless-mcp-[\d.]+-all\.jar$'
      windows: '^jadx-headless-mcp-[\d.]+-all\.jar$'

  # Agent-first decompiler ported from Ghidra (REA_KUNA_COMMAND).
  # Pinned to the version rea verifies; newer releases may work.
  kuna:
    github: Noelo-Lab/kuna
    version: v1.833
    assets:
      linux: '^kuna-v[\d.]+-linux-x86_64\.tar\.gz$'
      macos: '^kuna-v[\d.]+-macos-arm64\.tar\.gz$'
      windows: '^kuna-v[\d.]+-windows-x86_64\.zip$'
    strip: 1
    bin:
      linux:
        kuna: kuna
      macos:
        kuna: kuna
      windows:
        kuna: '**/kuna.exe'

  # APK decoding/rebuilding (REA_APKTOOL_COMMAND).
  apktool:
    github: iBotPeaches/Apktool
    version: latest
    assets:
      linux: '^apktool_[\d.]+\.jar$'
      macos: '^apktool_[\d.]+\.jar$'
      windows: '^apktool_[\d.]+\.jar$'
    bin:
      linux:
        apktool: {path: 'apktool_*.jar', jar: true}
      macos:
        apktool: {path: 'apktool_*.jar', jar: true}
      windows:
        apktool: {path: 'apktool_*.jar', jar: true}

  # Sign, zipalign and verify APKs (after apktool or apk-mitm changes)
  uber-apk-signer:
    github: patrickfav/uber-apk-signer
    version: latest
    assets:
      linux: '^uber-apk-signer-[\d.]+\.jar$'
      macos: '^uber-apk-signer-[\d.]+\.jar$'
      windows: '^uber-apk-signer-[\d.]+\.jar$'
    bin:
      linux: &uber-apk-signer
        uber-apk-signer: {path: 'uber-apk-signer-*.jar', jar: true}
      macos: *uber-apk-signer
      windows: *uber-apk-signer

  # Download APKs from Google Play, APKPure, F-Droid or Huawei AppGallery without a phone.
  # No macOS release: built with cargo there (component `build`).
  apkeep:
    github: EFForg/apkeep
    version: latest
    assets:
      linux: '^apkeep-x86_64-unknown-linux-gnu$'
      windows: '^apkeep-x86_64-pc-windows-msvc\.exe$'
    build: {cargo: apkeep}
    bin:
      linux:
        apkeep: apkeep-x86_64-unknown-linux-gnu
      macos:
        apkeep: bin/apkeep
      windows:
        apkeep: apkeep-x86_64-pc-windows-msvc.exe

  # frida-server for Android devices, the same version as the frida Python package
  # (Frida refuses a client/server mismatch). `rea-tools frida-server` pushes it.
  frida-server:
    github: frida/frida
    version: pip:frida
    assets:
      any:
        - '^frida-server-[\d.]+-android-arm64\.xz$'
        - '^frida-server-[\d.]+-android-arm\.xz$'
        - '^frida-server-[\d.]+-android-x86_64\.xz$'
        - '^frida-server-[\d.]+-android-x86\.xz$'

  # Community YARA rules (YARA Forge "core": the low false-positive set), for `yr scan`
  yara-forge:
    github: YARAHQ/yara-forge
    version: latest
    assets:
      any: ['^yara-forge-rules-core\.zip$']

  # JavaScript bundle unpacker/decompiler (REA_WAKARU_COMMAND).
  wakaru:
    github: pionxzh/wakaru
    version: latest
    assets:
      linux: '^wakaru-linux-x64\.tar\.gz$'
      macos: '^wakaru-darwin-arm64\.tar\.gz$'
      windows: '^wakaru-win32-x64\.zip$'
    bin:
      linux:
        wakaru: '**/wakaru'
      macos:
        wakaru: '**/wakaru'
      windows:
        wakaru: '**/wakaru.exe'

  # WebAssembly toolkit: wasm2wat, wasm-objdump, wasm-validate, ... (REA_WABT_BIN_DIRECTORY)
  wabt:
    github: WebAssembly/wabt
    version: latest
    assets:
      linux: '^wabt-[\d.]+-linux-x64\.tar\.gz$'
      macos: '^wabt-[\d.]+-macos-arm64\.tar\.gz$'
      windows: '^wabt-[\d.]+-windows-x64\.tar\.gz$'
    strip: 1
    bin:
      linux: &wabt-unix
        wasm2wat: bin/wasm2wat
        wat2wasm: bin/wat2wasm
        wasm-objdump: bin/wasm-objdump
        wasm-validate: bin/wasm-validate
      macos: *wabt-unix
      windows:
        wasm2wat: bin/wasm2wat.exe
        wat2wasm: bin/wat2wasm.exe
        wasm-objdump: bin/wasm-objdump.exe
        wasm-validate: bin/wasm-validate.exe

  # GDB 17 with pwndbg, self-contained (REA_PWNDBG_*); also provides plain `gdb`.
  # rea's core-context bridge accepts exactly this pwndbg version.
  pwndbg:
    github: pwndbg/pwndbg
    version: 2026.09.15
    assets:
      linux: '^pwndbg_[\d.]+_x86_64-portable\.tar\.xz$'
      macos: '^pwndbg_[\d.]+_macos_arm64-portable\.tar\.xz$'
    strip: 1
    bin:
      linux: &pwndbg-unix
        pwndbg: bin/pwndbg
        gdb: bin/gdb
      macos: *pwndbg-unix

  # --- GUI tools ---
  # Linux AppImages run without FUSE (extract-and-run); macOS uses the .app from the
  # .dmg; Windows uses portable zips.

  # Rizin GUI; bundles the rz-ghidra decompiler (the static rizin CLI cannot load plugins)
  cutter:
    github: rizinorg/cutter
    version: latest
    assets:
      linux: '^Cutter-v[\d.]+-Linux-x86_64\.AppImage$'
      macos: '^Cutter-v[\d.]+-macOS-arm64\.dmg$'
      windows: '^Cutter-v[\d.]+-Windows-x86_64\.zip$'
    bin:
      linux:
        cutter: {path: 'Cutter-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      macos:
        cutter: '*.app/Contents/MacOS/cutter'
      windows:
        cutter: '**/cutter.exe'

  # Hex editor with pattern language
  imhex:
    github: WerWolv/ImHex
    version: latest
    assets:
      linux: '^imhex-[\d.]+-x86_64\.AppImage$'
      macos: '^imhex-[\d.]+-macOS-arm64\.dmg$'
      windows: '^imhex-[\d.]+-Windows-Portable-x86_64\.zip$'
    bin:
      linux:
        imhex: {path: 'imhex-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      macos:
        imhex: '*.app/Contents/MacOS/imhex'
      windows:
        imhex: '**/imhex.exe'

  # ILSpy GUI (.NET decompiler); uses the .NET runtime in .runtime/dotnet
  ilspy:
    github: icsharpcode/ILSpy
    version: latest
    assets:
      linux: '^ILSpy_linux-x64_[\d.]+\.zip$'
      macos: '^ILSpy_macos-arm64_[\d.]+\.zip$'
      windows: '^ILSpy_windows_selfcontained_[\d.]+-x64\.zip$'
    bin:
      linux:
        ilspy: '**/ILSpy'
      macos:
        ilspy: '**/ILSpy'
      windows:
        ilspy: '**/ILSpy.exe'

  # --- component: porting ---

  # GUI for perf recordings (flame graphs, callers/callees, timeline). Linux only:
  # it reads perf.data, and perf exists only there.
  hotspot:
    github: KDAB/hotspot
    version: latest
    assets:
      linux: '^hotspot-v[\d.]+-x86_64\.AppImage$'
    bin:
      linux:
        hotspot: {path: 'hotspot-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}

  # Frame profiler for code you instrument (the native rewrite, the recompiled game):
  # the profiler GUI and the capture/export tools. The client library goes into the
  # instrumented program from Tracy's source at the same tag.
  tracy:
    github: wolfpld/tracy
    version: latest
    assets:
      linux: '^linux-[\d.]+\.zip$'
      macos: '^macos-[\d.]+\.zip$'
      windows: '^windows-[\d.]+\.zip$'
    bin:
      linux:
        tracy-profiler: {path: 'tracy-profiler-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
        tracy-capture: tracy-capture
        tracy-csvexport: tracy-csvexport
      macos:
        tracy-profiler: tracy-profiler.app/Contents/MacOS/tracy-profiler
        tracy-capture: tracy-capture
        tracy-csvexport: tracy-csvexport
      windows:
        tracy-profiler: tracy-profiler.exe
        tracy-capture: tracy-capture.exe
        tracy-csvexport: tracy-csvexport.exe

  # --- component: dos ---

  # DOSBox-X with its debugger (rea-suite dosbox). The macOS and Windows releases are built with
  # the heavy debugger and SDL2_net, which its debugger control channel (`mcp_server`) needs; Linux
  # has no release binary and the distributions build without the debugger, so Linux builds the
  # release's source as upstream's CI does (platforms/linux/build-dosbox-x.sh, a few minutes).
  # `bin:` the SDL2 builds in the macOS and Windows zips.
  dosbox-x:
    github: joncampbell123/dosbox-x
    version: latest
    assets:
      macos: '^dosbox-x-macosx-arm64-\d{4}\.\d{2}\.\d{2}\.zip$'
      windows: '^dosbox-x-vsbuild-win64-\d{4}\.\d{2}\.\d{2}-portable\.zip$'
    build: {script: platforms/linux/build-dosbox-x.sh}
    bin:
      linux:
        dosbox-x: bin/dosbox-x
      macos:
        dosbox-x: dosbox-x-sdl2/dosbox-x.app/Contents/MacOS/dosbox-x
      windows:
        dosbox-x: 'bin/x64/Release SDL2/dosbox-x.exe'

  # --- component: xbox ---

  # Original Xbox emulator (QEMU-based, low-level: real kernel, NV2A, MCPX) with QEMU's GDB stub
  # (`-s`, `-S`) and monitor. Needs the owner's MCPX boot ROM, flash BIOS and an HDD image
  # (docs/XBOX-CLASSIC.md). The macOS build is universal (arm64 and x86_64).
  xemu:
    github: xemu-project/xemu
    version: latest
    assets:
      linux: '^xemu-[\d.]+-x86_64\.AppImage$'
      macos: '^xemu-[\d.]+-macos-universal\.zip$'
      windows: '^xemu-[\d.]+-windows-x86_64\.zip$'
    # xemu restarts itself from the extracted AppImage with its QEMU arguments, so the AppImage
    # runtime never removes its extraction: TMPDIR keeps that (47 MB) in the install, not in /tmp.
    bin:
      linux:
        xemu: {path: 'xemu-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1', TMPDIR: '{dir}'}}
      macos:
        xemu: xemu.app/Contents/MacOS/xemu
      windows:
        xemu: xemu.exe

  # --- component: ps3 ---

  # PS3 emulator and debugger (GPL-2): `rea-suite ps3 decrypt` (--decrypt, headless), the GDB
  # stub (PPU threads), PINE/IPC memory access, logs. A rolling release, published per platform
  # in a repository of its own, with the same tag (build-<commit>) in each. Pinned to the build
  # docs/PS3.md was checked with (2026-11-13); REA_RPCS3_BUILD (run or .env) chooses another:
  # `latest` or a tag. Move the pin with rpcs3-source below, same commit. Firmware is the
  # player's own (rpcs3 --installfw PS3UPDAT.PUP).
  rpcs3:
    github:
      linux: RPCS3/rpcs3-binaries-linux
      macos: RPCS3/rpcs3-binaries-mac-arm64
      windows: RPCS3/rpcs3-binaries-win
    version: build-9b8974d32e73c897a5fcd6bdf69413ca7e436b01
    version-env: REA_RPCS3_BUILD
    assets:
      linux: '^rpcs3-v[\d.]+-\d+-\w+_linux64\.AppImage$'
      macos: '^rpcs3-v[\d.]+-\d+-\w+_macos_aarch64\.7z$'
      windows: '^rpcs3-v[\d.]+-\d+-\w+_win64_msvc\.7z$'
    bin:
      linux:
        rpcs3: {path: 'rpcs3-*.AppImage', env: {APPIMAGE_EXTRACT_AND_RUN: '1'}}
      macos:
        rpcs3: RPCS3.app/Contents/MacOS/rpcs3
      windows:
        rpcs3: rpcs3.exe

  # RPCS3's source at the commit of the build above: the names `rea-suite ps3` hashes into NIDs
  # (REG_FUNC registrations, PPUFunction.cpp's tables). Data only, never built.
  rpcs3-source:
    version: 9b8974d32e73c897a5fcd6bdf69413ca7e436b01
    url:
      linux: &rpcs3-source https://github.com/RPCS3/rpcs3/archive/9b8974d32e73c897a5fcd6bdf69413ca7e436b01.tar.gz
      macos: *rpcs3-source
      windows: *rpcs3-source
    strip: 1

  # PS3 static recompilation toolkit (MIT): the Python pipeline (ELF/PRX and fSELF readers, PPU
  # and SPU disassemblers and lifters, SPU image extraction, NID tools) and the runtime library
  # per platform. Run its scripts with `uv run python tools/ps3recomp/current/tools/<script>.py`.
  ps3recomp:
    github: sp00nznet/ps3recomp
    version: latest
    assets:
      linux: '^ps3recomp-v[\d.]+-linux-x64\.zip$'
      macos: '^ps3recomp-v[\d.]+-mac-arm64\.zip$'
      windows: '^ps3recomp-v[\d.]+-win-x64\.zip$'
    strip: 1

  # --- component: steam ---

  # Valve's SteamCMD; updates itself in place on first run
  steamcmd:
    url:
      linux: https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
      macos: https://steamcdn-a.akamaihd.net/client/installer/steamcmd_osx.tar.gz
      windows: https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip
    version: rolling
    bin:
      linux:
        steamcmd: steamcmd.sh
      macos:
        steamcmd: steamcmd.sh
      windows:
        steamcmd: steamcmd.exe

  # SteamStub DRM unpacker (.NET Framework, Windows)
  steamless:
    github: atom0s/Steamless
    version: latest
    assets:
      windows: '^Steamless\..*\.zip$'
    bin:
      windows:
        steamless: '**/Steamless.exe'
        steamless-cli: '**/Steamless.CLI.exe'

  # --- Windows only ---

  # .NET debugger/decompiler
  dnspy:
    github: dnSpyEx/dnSpy
    version: latest
    assets:
      windows: '^dnSpy-net-win64\.zip$'
    bin:
      windows:
        dnspy: '**/dnSpy.exe'

  # PE viewer/editor
  pe-bear:
    github: hasherezade/pe-bear
    version: latest
    assets:
      windows: '^PE-bear_[\d.]+_qt6_x64_win_vs22\.zip$'
    bin:
      windows:
        pe-bear: '**/PE-bear.exe'

  # Debugger; managed here (not winget) so plugins land in a known directory.
  x64dbg:
    github: x64dbg/x64dbg
    version: latest
    assets:
      windows: '^snapshot_[\d_-]+\.zip$'
    strip: 1
    bin:
      windows:
        x64dbg: x64/x64dbg.exe
        x32dbg: x32/x32dbg.exe
        x96dbg: x96dbg.exe
    plugins:
      # anti-anti-debug
      scyllahide:
        github: x64dbg/ScyllaHide
        asset: '^ScyllaHide_.*\.zip$'
        copy:
          'x64dbg/x64/plugins/*': x64/plugins
          'x64dbg/x32/plugins/*': x32/plugins
