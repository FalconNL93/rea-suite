# Optional parts of the suite. Everything not listed here is always installed.
#
# Selection, first match wins:
#   1. REA_SUITE_COMPONENTS in the environment (space separated names)
#   2. REA_SUITE_COMPONENTS in .env (written by `rea-suite select`; see .env.example)
#   3. the components marked `default: true`
#
# A component can bring:
#   apt / brew / winget:  system packages (apt: Debian names, translated for Fedora/RHEL and
#                  Arch by platforms/linux/dnf-names.txt and pacman-names.txt; apt-packages.txt,
#                  platforms/macos/Brewfile, platforms/windows/winget.json);
#                  a brew cask is written `cask:<name>`
#   uv-groups:     dependency groups from pyproject.toml
#   uv-tools:      CLI tools in their own uv environments, as in common/uv-tools.txt
#   tools:         entries from common/tools.yml (installed only when selected)
#   playwright:    browsers installed with rea-agents' own playwright-core (always the
#                  build that version expects) into .runtime/ms-playwright
#
# Deselecting stops installing and checking a component; uv groups are removed on
# the next sync, system packages, uv tools and tools are left in place.

components:
  build:
    description: Compilers and build tools (gcc/clang/llvm, mingw-w64, nasm, autotools, Rust via rustup) and foreign-arch tools (binutils/gdb-multiarch, qemu-user); also builds tools that have no release for this platform
    default: true
    apt: [rustup, build-essential, gcc-multilib, g++-multilib, clang, lld, llvm, mingw-w64, gcc-mingw-w64,
          g++-mingw-w64, nasm, autoconf, automake, libtool, bison, flex, pkgconf, ccache,
          binutils-multiarch, gdb-multiarch, qemu-user, qemu-user-binfmt]
    winget: [BrechtSanders.WinLibs.POSIX.UCRT, NASM.NASM, Rustlang.Rustup]
    # clang comes with the Xcode Command Line Tools; no multilib, gdb or qemu-user on macOS
    brew: [rustup, llvm, lld, mingw-w64, nasm, autoconf, automake, libtool, bison, flex, pkgconf, ccache]
    # tools that exist only as source (built with the compilers above)
    tools: [pycdc]

  browser:
    description: Chromium for REA's browser captures and web module tracing (Playwright's build for the installed rea-agents; ~300 MB)
    default: true
    playwright: [chromium]

  mobile:
    description: Android work beyond adb and Frida, which are always there - scrcpy (device screen), apkeep (download APKs), uber-apk-signer
    apt: [scrcpy]
    brew: [scrcpy]
    winget: [Genymobile.scrcpy]
    tools: [apkeep, uber-apk-signer]

  hardware:
    description: sigrok-cli for logic analyzer and signal recordings; REA decodes them (REA_SIGROK_COMMAND). Linux and macOS
    apt: [sigrok-cli]
    brew: [sigrok-cli]

  angr:
    description: angr binary analysis framework (symbolic execution, CFG recovery; ~1 GB)
    uv-groups: [angr]

  steam:
    description: SteamCMD (download game builds and depots) and Steamless (SteamStub DRM unpacker, Windows)
    apt: [lib32gcc-s1]
    tools: [steamcmd, steamless]

  # Wine alone is over 1 GB installed, so this is not part of the default install.
  # macOS has no Wine here (Homebrew disabled its casks), rr and perf are Linux-only:
  # see the README's "Porting old games".
  porting:
    description: Porting old Windows games - Wine with winedbg (run and trace the original binary), rr (record and replay) and perf + hotspot (sampling profiles) on Linux, Tracy (instrumented profiles), WinDbg with Time Travel Debugging and the ViGEmBus driver (virtual pads, rea-suite pad) on Windows
    apt: [wine, wine64, rr, linux-perf]
    winget: [Microsoft.WinDbg, ViGEm.ViGEmBus]
    tools: [hotspot, tracy]

  vm:
    description: Virtual machines for running untrusted samples (QEMU + OVMF on Linux, VirtualBox on Windows; UTM on macOS)
    apt: [qemu-system-x86, qemu-utils, ovmf]
    winget: [Oracle.VirtualBox]
    brew: [qemu, "cask:utm"]

  dos:
    description: DOS games - DOSBox-X with its debugger (rea-suite dosbox); on Linux built from source (needs component `build`), the headers for that here
    apt: [libncurses-dev, libpng-dev, zlib1g-dev, libx11-dev, libxext-dev, libasound2-dev]
    tools: [dosbox-x]

  playstation:
    description: PS1/PS2 - disc preparation (dumpsxiso/mkpsxiso, chdman), PS1 media (jPSXdec), the PCSX-Redux and PCSX2 emulators with their debuggers, and the exact-version PSX and Emotion Engine Ghidra loaders
    # chdman: CHD images (Redump sets are often CHD). Windows has no package with chdman
    # on PATH (MAME's winget installer needs a location); see docs/PLAYSTATION.md.
    apt: [mame-tools]
    brew: [rom-tools]
    tools: [mkpsxiso, jpsxdec, pcsx-redux, pcsx2]

  decomp:
    description: Decompilation projects - splat (split a MIPS executable into assembly and data; PS1, PS2, N64, PSP) and objdiff (match compiled objects against the original, function by function)
    # splat pins PyYAML, tqdm and colorama exactly, so it gets an environment of its own.
    uv-tools: ['splat64[mips]']
    tools: [objdiff]

  ps3:
    description: PS3 - RPCS3 with its debugger, GDB stub and decryption (rea-suite ps3, docs/PS3.md), the NID names from RPCS3's source, ps3recomp's pipeline, and the PS3 ELF scripts for Ghidra
    tools: [rpcs3, rpcs3-source, ps3recomp]

  game-archives:
    description: Game archives and Xbox discs (extract-xiso, ZArchive's zarchive to create .zar files; Windows also XGDTool and QuickBMS); zarchive builds from source on Linux/macOS. Reading a .zar needs none of it (rea-suite zar)
    # System zstd headers/library are required for native ZArchive builds.
    apt: [libzstd-dev]
    brew: [zstd]
    tools: [extract-xiso, zarchive, xgdtool, quickbms]

  xbox:
    description: Original Xbox (2001) games - xemu with QEMU's GDB stub (rea-suite xbox, docs/XBOX-CLASSIC.md) and extract-xiso; the XBE loader for Ghidra is always installed
    tools: [xemu, extract-xiso]

  gamecube:
    description: GameCube and Wii - Dolphin with its GDB stub and DolphinTool (Linux from the distribution), dtk (decomp-toolkit; it also reads and extracts disc images in every format), nod-rs for rea-suite gamecube's RVZ/WBFS/WIA images, and the GameCube loader for Ghidra (built from source)
    # The Debian and Ubuntu name (Ubuntu 26.04 carries 2512); Fedora and Arch names not checked.
    apt: [dolphin-emu]
    uv-groups: [gamecube]
    tools: [dolphin, dtk]

  psp:
    description: PSP - PPSSPP with its WebSocket debugger, its source's HLE tables to name NIDs (rea-suite psp), and ghidra-allegrex for Ghidra, which REA's PSP profile uses
    tools: [ppsspp, ppsspp-source]
