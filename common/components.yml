# Optional parts of the suite. Everything not listed here is always installed.
#
# Selection, first match wins:
#   1. REA_SUITE_COMPONENTS in the environment (space separated names)
#   2. REA_SUITE_COMPONENTS in .env (written by `rea-suite select`; see .env.example)
#   3. the components marked `default: true`
#
# A component can bring:
#   apt / brew / winget:  system packages (platforms/linux/apt-packages.txt,
#                  platforms/macos/Brewfile, platforms/windows/winget.json);
#                  a brew cask is written `cask:<name>`
#   uv-groups:     dependency groups from pyproject.toml
#   tools:         entries from common/tools.yml (installed only when selected)
#
# Deselecting stops installing and checking a component; uv groups are removed on
# the next sync, system packages and tools are left in place.

components:
  build:
    description: Compilers and build tools (gcc/clang/llvm, mingw-w64, nasm, autotools, Rust via rustup) and foreign-arch tools (binutils/gdb-multiarch, qemu-user); also builds tools that have no release for this platform
    default: true
    apt: [rustup, build-essential, gcc-multilib, g++-multilib, clang, lld, llvm, mingw-w64, gcc-mingw-w64,
          g++-mingw-w64, nasm, autoconf, automake, libtool, bison, flex, pkgconf, ccache,
          binutils-multiarch, gdb-multiarch, qemu-user, qemu-user-binfmt]
    winget: [BrechtSanders.WinLibs.POSIX.UCRT, NASM.NASM, Rustlang.Rustup]
    # clang comes with the Xcode Command Line Tools; no multilib, gdb or qemu-user on macOS
    brew: [rustup, llvm, lld, mingw-w64, nasm, autoconf, automake, libtool, bison, flex, pkgconf, ccache]
    # tools that exist only as source (built with the compilers above)
    tools: [pycdc]

  angr:
    description: angr binary analysis framework (symbolic execution, CFG recovery; ~1 GB)
    uv-groups: [angr]

  steam:
    description: SteamCMD (download game builds and depots) and Steamless (SteamStub DRM unpacker, Windows)
    apt: [lib32gcc-s1]
    tools: [steamcmd, steamless]

  vm:
    description: Virtual machines for running untrusted samples (QEMU + OVMF on Linux, VirtualBox on Windows; UTM on macOS)
    apt: [qemu-system-x86, qemu-utils, ovmf]
    winget: [Oracle.VirtualBox]
    brew: [qemu, "cask:utm"]
